[project]
name = "cheap-cli"
version = "0.1.0"
description = "Three CLIs that delegate I/O-heavy tasks to a cheap LLM via OpenRouter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
ask-cheap = "cheap_cli.ask:main"
write-cheap = "cheap_cli.write:main"
summarize-cheap = "cheap_cli.summarize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cheap_cli"]

[dependency-groups]
dev = ["pytest>=8"]
